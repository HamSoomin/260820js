<!DOCTYPE html>
<html lang="jp">

<head>
    <meta charset="UTF-8">
    <title>フィルタリング</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="wrapper">
        <h1>Filtering</h1>

        <div id="buttons">
            <button value="all" class="current">all</button>
            <button value="red">red</button>
            <button value="blue">blue</button>
            <button value="yellow">yellow</button>
            <button value="gray">gray</button>
            <button value="flower">flower</button>
            <button value="jacket">jacket</button>
            <button value="skirt">skirt</button>
            <button value="pants">pants</button>
        </div>

        <ul id="list">
            <li class="pink flower">
                <img src="img/flower.png" alt="item1">
            </li>
            <li class="purple jacket">
                <img src="img/clover.png" alt="item2">
            </li>
            <li class="green shirt">
                <img src="img/tree.png" alt="item3">
            </li>
            <li class="orange flower">
                <img src="img/flower.png" alt="item4">
            </li>
            <li class="pink pants">
                <img src="img/clover.png" alt="item5">
            </li>
            <li class="purple shirt">
                <img src="img/tree.png" alt="item6">
            </li>
            <li class="orange shirt">
                <img src="img/shirt.png" alt="item7">
            </li>
            <li class="green pants">
                <img src="img/clover.png" alt="item8">
            </li>
            <li class="purple flower">
                <img src="img/flower.png" alt="item9">
            </li>
            <li class="pink shirt">
                <img src="img/shirt.png" alt="item10">
            </li>
            <li class="orange skirt">
                <img src="img/tree.png" alt="item11">
            </li>
            <li class="green jacket">
                <img src="img/clover.png" alt="item12">
            </li>
        </ul>
    </div>

    <!-- jQuery本体 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <!--自作JS-->
    <script src="script.js"></script>
</body>

</html>
